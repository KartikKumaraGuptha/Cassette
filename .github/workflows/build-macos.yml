name: Build Cassette for macOS 27

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release and attach the DMG"
        required: true
        default: false
        type: boolean

      version:
        description: "Cassette version"
        required: true
        default: "1.0.0"
        type: string

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build:
    name: macOS 27 Apple Silicon

    runs-on: xcode-27-arm64

    env:
      CASSETTE_VERSION: ${{ inputs.version || '1.0.0' }}

    steps:

      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      # ------------------------------------------------------------
      # 3. Show environment
      # ------------------------------------------------------------

      - name: Show build environment
        shell: bash
        run: |
          echo "======================================"
          echo "Cassette macOS 27 Build"
          echo "======================================"

          sw_vers

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Runner:"
          echo "$RUNNER_OS"

          echo "======================================"


      # ------------------------------------------------------------
      # 4. Install dependencies
      # ------------------------------------------------------------

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt

          python -m pip install pyinstaller


      # ------------------------------------------------------------
      # 5. Verify Python source
      # ------------------------------------------------------------

      - name: Verify source
        shell: bash
        run: |
          python -m compileall -q \
            config \
            gestures \
            services \
            spotify \
            ui \
            main.py

          echo "Source compilation successful."


      # ------------------------------------------------------------
      # 6. Verify required files
      # ------------------------------------------------------------

      - name: Verify project files
        shell: bash
        run: |
          test -f main.py
          test -f Cassette_mac.spec
          test -f requirements.txt
          test -f logo.png

          echo "Required files found."


      # ------------------------------------------------------------
      # 7. Create macOS icon
      # ------------------------------------------------------------

      - name: Create macOS app icon
        shell: bash
        run: |
          rm -rf cassette.iconset
          rm -f cassette.icns

          mkdir -p cassette.iconset

          sips -z 16 16 \
            logo.png \
            --out cassette.iconset/icon_16x16.png

          sips -z 32 32 \
            logo.png \
            --out cassette.iconset/icon_16x16@2x.png

          sips -z 32 32 \
            logo.png \
            --out cassette.iconset/icon_32x32.png

          sips -z 64 64 \
            logo.png \
            --out cassette.iconset/icon_32x32@2x.png

          sips -z 128 128 \
            logo.png \
            --out cassette.iconset/icon_128x128.png

          sips -z 256 256 \
            logo.png \
            --out cassette.iconset/icon_128x128@2x.png

          sips -z 256 256 \
            logo.png \
            --out cassette.iconset/icon_256x256.png

          sips -z 512 512 \
            logo.png \
            --out cassette.iconset/icon_256x256@2x.png

          sips -z 512 512 \
            logo.png \
            --out cassette.iconset/icon_512x512.png

          sips -z 1024 1024 \
            logo.png \
            --out cassette.iconset/icon_512x512@2x.png

          iconutil \
            -c icns \
            cassette.iconset \
            -o cassette.icns

          rm -rf cassette.iconset

          test -f cassette.icns

          echo "Cassette.icns created."


      # ------------------------------------------------------------
      # 8. Build Cassette.app
      # ------------------------------------------------------------

      - name: Build Cassette.app
        shell: bash
        run: |
          rm -rf build
          rm -rf dist

          python -m PyInstaller \
            --noconfirm \
            --clean \
            Cassette_mac.spec

          test -d dist/Cassette.app

          test -f \
            dist/Cassette.app/Contents/MacOS/Cassette

          echo "Cassette.app successfully created."


      # ------------------------------------------------------------
      # 9. Verify ARM64
      # ------------------------------------------------------------

      - name: Verify ARM64 executable
        shell: bash
        run: |
          echo "Executable architecture:"

          file \
            dist/Cassette.app/Contents/MacOS/Cassette

          echo ""

          echo "Detailed architecture:"

          lipo -info \
            dist/Cassette.app/Contents/MacOS/Cassette

          echo ""

          echo "Runner architecture:"
          uname -m


      # ------------------------------------------------------------
      # 10. Set application version
      # ------------------------------------------------------------

      - name: Stamp version
        shell: bash
        run: |
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $CASSETTE_VERSION" \
            dist/Cassette.app/Contents/Info.plist

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion $CASSETTE_VERSION" \
            dist/Cassette.app/Contents/Info.plist


      # ------------------------------------------------------------
      # 11. Verify application
      # ------------------------------------------------------------

      - name: Verify application
        shell: bash
        run: |
          echo "======================================"
          echo "APPLICATION"
          echo "======================================"

          echo ""
          echo "Bundle identifier:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            dist/Cassette.app/Contents/Info.plist

          echo ""
          echo "Version:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            dist/Cassette.app/Contents/Info.plist

          echo ""
          echo "Architecture:"

          file \
            dist/Cassette.app/Contents/MacOS/Cassette

          echo ""
          echo "Application size:"

          du -sh dist/Cassette.app


      # ------------------------------------------------------------
      # 12. Create DMG
      # ------------------------------------------------------------

      - name: Create DMG
        shell: bash
        run: |
          rm -rf dmg_root

          mkdir -p dmg_root

          cp -R \
            dist/Cassette.app \
            dmg_root/

          ln -s \
            /Applications \
            dmg_root/Applications

          hdiutil create \
            -volname "Cassette $CASSETTE_VERSION" \
            -srcfolder dmg_root \
            -ov \
            -format UDZO \
            "dist/Cassette-macos27-arm64.dmg"

          test -f \
            "dist/Cassette-macos27-arm64.dmg"

          echo "DMG created successfully."


      # ------------------------------------------------------------
      # 13. Create portable ZIP
      # ------------------------------------------------------------

      - name: Create app ZIP
        shell: bash
        run: |
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            dist/Cassette.app \
            "dist/Cassette-macos27-arm64.app.zip"

          test -f \
            "dist/Cassette-macos27-arm64.app.zip"

          echo "App ZIP created successfully."


      # ------------------------------------------------------------
      # 14. Final verification
      # ------------------------------------------------------------

      - name: Final verification
        shell: bash
        run: |
          echo "======================================"
          echo "FINAL BUILD"
          echo "======================================"

          test -f \
            "dist/Cassette-macos27-arm64.dmg"

          test -f \
            "dist/Cassette-macos27-arm64.app.zip"

          test -d \
            "dist/Cassette.app"

          test -f \
            "dist/Cassette.app/Contents/MacOS/Cassette"

          echo ""
          echo "DMG:"
          ls -lh \
            "dist/Cassette-macos27-arm64.dmg"

          echo ""
          echo "APP ZIP:"
          ls -lh \
            "dist/Cassette-macos27-arm64.app.zip"

          echo ""
          echo "Architecture:"
          file \
            dist/Cassette.app/Contents/MacOS/Cassette

          echo ""
          echo "======================================"
          echo "BUILD SUCCESSFUL"
          echo "======================================"


      # ------------------------------------------------------------
      # 15. Upload artifacts
      # ------------------------------------------------------------

      - name: Upload macOS 27 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cassette-macOS-27-ARM64
          path: |
            dist/Cassette-macos27-arm64.dmg
            dist/Cassette-macos27-arm64.app.zip
          if-no-files-found: error
          retention-days: 30


      # ------------------------------------------------------------
      # 16. Optional GitHub Release
      # ------------------------------------------------------------

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
          files: |
            dist/Cassette-macos27-arm64.dmg
            dist/Cassette-macos27-arm64.app.zip
          generate_release_notes: true
