name: Build Cassette for macOS

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release and attach the DMGs"
        required: true
        default: false
        type: boolean

      version:
        description: "Version shown in the macOS app bundle"
        required: true
        default: "1.0.0"
        type: string

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build:
    name: macOS ${{ matrix.arch_name }}

    strategy:
      fail-fast: false

      matrix:
        include:

          # Apple Silicon
          # M1 / M2 / M3 / M4 / future Apple Silicon
          - runner: macos-26
            arch: arm64
            arch_name: Apple-Silicon

          # Intel
          - runner: macos-26-intel
            arch: x86_64
            arch_name: Intel

    runs-on: ${{ matrix.runner }}

    env:
      CASSETTE_VERSION: ${{ inputs.version || '1.0.0' }}

    steps:

      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. Setup Python
      # ------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      # ------------------------------------------------------------
      # 3. Show build environment
      # ------------------------------------------------------------

      - name: Show build environment
        shell: bash
        run: |
          echo "======================================"
          echo "Cassette macOS Build"
          echo "======================================"
          echo "Runner: $RUNNER_OS"
          echo "Architecture: ${{ matrix.arch }}"
          echo "Architecture name: ${{ matrix.arch_name }}"
          echo "Version: $CASSETTE_VERSION"
          echo ""
          sw_vers
          echo ""
          python --version
          echo ""
          uname -m
          echo "======================================"


      # ------------------------------------------------------------
      # 4. Install Python dependencies
      # ------------------------------------------------------------

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt

          python -m pip install pyinstaller


      # ------------------------------------------------------------
      # 5. Verify source code
      # ------------------------------------------------------------

      - name: Verify source
        shell: bash
        run: |
          python -m compileall -q \
            config \
            gestures \
            services \
            spotify \
            ui \
            main.py

          echo "Python source compilation successful."


      # ------------------------------------------------------------
      # 6. Verify required project files
      # ------------------------------------------------------------

      - name: Verify project files
        shell: bash
        run: |
          test -f main.py
          test -f Cassette_mac.spec
          test -f requirements.txt
          test -f logo.png

          echo "Required project files found."


      # ------------------------------------------------------------
      # 7. Make macOS application icon
      # ------------------------------------------------------------

      - name: Create macOS app icon
        shell: bash
        run: |
          rm -rf cassette.iconset
          rm -f cassette.icns

          mkdir -p cassette.iconset

          sips -z 16 16 \
            logo.png \
            --out cassette.iconset/icon_16x16.png

          sips -z 32 32 \
            logo.png \
            --out cassette.iconset/icon_16x16@2x.png

          sips -z 32 32 \
            logo.png \
            --out cassette.iconset/icon_32x32.png

          sips -z 64 64 \
            logo.png \
            --out cassette.iconset/icon_32x32@2x.png

          sips -z 128 128 \
            logo.png \
            --out cassette.iconset/icon_128x128.png

          sips -z 256 256 \
            logo.png \
            --out cassette.iconset/icon_128x128@2x.png

          sips -z 256 256 \
            logo.png \
            --out cassette.iconset/icon_256x256.png

          sips -z 512 512 \
            logo.png \
            --out cassette.iconset/icon_256x256@2x.png

          sips -z 512 512 \
            logo.png \
            --out cassette.iconset/icon_512x512.png

          sips -z 1024 1024 \
            logo.png \
            --out cassette.iconset/icon_512x512@2x.png

          iconutil \
            -c icns \
            cassette.iconset \
            -o cassette.icns

          rm -rf cassette.iconset

          test -f cassette.icns

          echo "macOS icon created."


      # ------------------------------------------------------------
      # 8. Build Cassette.app
      # ------------------------------------------------------------

      - name: Build Cassette.app
        shell: bash
        run: |
          rm -rf build
          rm -rf dist

          python -m PyInstaller \
            --noconfirm \
            --clean \
            Cassette_mac.spec

          test -d dist/Cassette.app

          test -f \
            dist/Cassette.app/Contents/MacOS/Cassette

          echo "Cassette.app created successfully."


      # ------------------------------------------------------------
      # 9. Verify executable architecture
      # ------------------------------------------------------------

      - name: Verify executable architecture
        shell: bash
        run: |
          echo "Expected architecture:"
          echo "${{ matrix.arch }}"

          echo ""
          echo "Actual executable:"
          file dist/Cassette.app/Contents/MacOS/Cassette

          echo ""
          echo "Machine architecture:"
          lipo -info dist/Cassette.app/Contents/MacOS/Cassette


      # ------------------------------------------------------------
      # 10. Stamp application version
      # ------------------------------------------------------------

      - name: Stamp version
        shell: bash
        run: |
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $CASSETTE_VERSION" \
            dist/Cassette.app/Contents/Info.plist

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion $CASSETTE_VERSION" \
            dist/Cassette.app/Contents/Info.plist

          echo "Version:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            dist/Cassette.app/Contents/Info.plist


      # ------------------------------------------------------------
      # 11. Verify bundle identifier
      # ------------------------------------------------------------

      - name: Verify application bundle
        shell: bash
        run: |
          echo "Bundle identifier:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            dist/Cassette.app/Contents/Info.plist

          echo ""

          echo "Application version:"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            dist/Cassette.app/Contents/Info.plist

          echo ""

          echo "Application size:"

          du -sh dist/Cassette.app


      # ------------------------------------------------------------
      # 12. Create DMG
      # ------------------------------------------------------------

      - name: Package DMG
        shell: bash
        run: |
          rm -rf dmg_root

          mkdir -p dmg_root

          cp -R \
            dist/Cassette.app \
            dmg_root/

          ln -s \
            /Applications \
            dmg_root/Applications

          hdiutil create \
            -volname "Cassette $CASSETTE_VERSION" \
            -srcfolder dmg_root \
            -ov \
            -format UDZO \
            "dist/Cassette-${{ matrix.arch }}.dmg"

          test -f \
            "dist/Cassette-${{ matrix.arch }}.dmg"

          echo "DMG created."


      # ------------------------------------------------------------
      # 13. Create portable .app ZIP
      # ------------------------------------------------------------

      - name: Package portable ZIP
        shell: bash
        run: |
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            dist/Cassette.app \
            "dist/Cassette-${{ matrix.arch }}.app.zip"

          test -f \
            "dist/Cassette-${{ matrix.arch }}.app.zip"

          echo "ZIP created."


      # ------------------------------------------------------------
      # 14. Final artifact verification
      # ------------------------------------------------------------

      - name: Verify artifacts
        shell: bash
        run: |
          echo "======================================"
          echo "FINAL BUILD VERIFICATION"
          echo "======================================"

          test -f \
            "dist/Cassette-${{ matrix.arch }}.dmg"

          test -f \
            "dist/Cassette-${{ matrix.arch }}.app.zip"

          test -d \
            "dist/Cassette.app"

          test -f \
            "dist/Cassette.app/Contents/MacOS/Cassette"

          echo ""
          echo "Architecture:"
          file \
            dist/Cassette.app/Contents/MacOS/Cassette

          echo ""
          echo "Bundle:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            dist/Cassette.app/Contents/Info.plist

          echo ""
          echo "Version:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            dist/Cassette.app/Contents/Info.plist

          echo ""
          echo "Files:"
          ls -lh \
            "dist/Cassette-${{ matrix.arch }}.dmg" \
            "dist/Cassette-${{ matrix.arch }}.app.zip"

          echo ""
          echo "Application size:"
          du -sh dist/Cassette.app

          echo ""
          echo "======================================"
          echo "BUILD SUCCESSFUL"
          echo "======================================"


      # ------------------------------------------------------------
      # 15. Upload artifacts to GitHub Actions
      # ------------------------------------------------------------

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cassette-macOS-${{ matrix.arch }}
          path: |
            dist/Cassette-${{ matrix.arch }}.dmg
            dist/Cassette-${{ matrix.arch }}.app.zip
          if-no-files-found: error
          retention-days: 30


      # ------------------------------------------------------------
      # 16. Create GitHub Release
      # ------------------------------------------------------------

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
          files: |
            dist/Cassette-${{ matrix.arch }}.dmg
            dist/Cassette-${{ matrix.arch }}.app.zip
          generate_release_notes: true
